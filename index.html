<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>플래시카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://code.responsivevoice.org/responsivevoice.js"></script>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- Firebase 설정 (API 키 포함, .gitignore 처리됨) -->
<script src="firebase-config.js"></script>
</head>
<body>

<header class="app-header">
  <h1 id="logoBtn">플래시<span class="accent">카드</span></h1>
  <div class="header-actions">
    <button class="auth-btn" id="authBtn">
      <span class="auth-avatar" id="authAvatar" hidden></span>
      <span id="authLabel">Google 로그인</span>
    </button>
    <button class="icon-btn" id="themeToggle" title="다크 모드" aria-label="다크 모드 전환">
      <span class="theme-icon">🌙</span>
    </button>
  </div>
</header>

<main id="appRoot">

<!-- HOME VIEW -->
<section class="view" id="homeView">
  <div class="home-topbar">
    <button class="btn" id="importCsvBtn">📊 CSV 가져오기</button>
    <button class="btn ql-primary" id="newSetBtn">＋ 새 단어장</button>
  </div>
  <div id="setList" class="ql-set-list"></div>
  <input type="file" id="csvFileInput" accept=".csv,text/csv" hidden />
</section>

<!-- SET DETAIL VIEW -->
<section class="view" id="detailView">
  <!-- 초록 헤더 배너 -->
  <div class="detail-banner" id="detailBanner">
    <button class="detail-back" id="detailBackBtn">‹</button>
    <div class="detail-badge">단어</div>
    <h2 class="detail-name" id="detailName"></h2>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-actions">
      <button class="detail-action-btn" data-daction="edit">✎ 편집</button>
      <button class="detail-action-btn" data-daction="export">⬇ 내보내기</button>
      <button class="detail-action-btn danger" data-daction="delete">🗑 삭제</button>
    </div>
  </div>
  <!-- 액션 툴바 -->
  <div class="detail-ops-bar">
    <div class="ops-wrap">
      <button class="ops-tab" id="opsExtractBtn">⊕ 추출/결합 ▾</button>
      <div class="ops-dropdown" id="opsDropdown">
        <button class="ops-item" data-op="clone">□ 세트 복제</button>
        <button class="ops-item" data-op="star-extract">★ 별점 필터로 새 단어장</button>
        <button class="ops-item" data-op="extract-cards">✂ 카드 선택해 새 단어장으로</button>
        <button class="ops-item" data-op="merge-sets">⊕ 여러 세트 카드 합치기</button>
      </div>
    </div>
    <button class="ql-study-btn" id="detailStudyBtn">▶ 학습하기</button>
  </div>
  <!-- 카드 그리드 -->
  <div class="detail-grid" id="detailGrid"></div>
</section>

<!-- EDIT VIEW -->
<section class="view" id="editView">
  <div class="view-header">
    <div class="view-title" id="editTitle">새 단어장</div>
    <button class="btn ghost" id="editBackBtn">← 취소</button>
  </div>

  <div class="field-group">
    <label class="field-label" for="editNameInput">단어장 이름</label>
    <input type="text" class="text-input" id="editNameInput" placeholder="예) TOEIC Day 1" />
  </div>

  <div class="field-group">
    <label class="field-label">카드 테마 색상</label>
    <div class="color-row">
      <input type="color" class="color-picker" id="editColorInput" value="#3B82F6" />
      <div class="color-preview" id="colorPreview"></div>
      <span class="hint">카드 윗부분 색상에 적용됩니다</span>
    </div>
  </div>

  <div class="cards-table-wrap">
    <table class="cards-table">
      <thead>
        <tr>
          <th class="row-num">#</th>
          <th>단어</th>
          <th>발음</th>
          <th>뜻</th>
          <th class="row-actions"></th>
        </tr>
      </thead>
      <tbody id="editTableBody"></tbody>
    </table>
  </div>

  <div class="add-row-wrap">
    <button class="btn" id="addRowBtn">＋ 카드 추가</button>
    <span class="card-count" id="cardCount"></span>
  </div>

  <div class="edit-footer">
    <button class="btn primary lg" id="saveSetBtn">💾 저장</button>
  </div>
</section>

<!-- SESSION SETUP VIEW -->
<section class="view" id="setupView">
  <div class="view-header">
    <div class="view-title" id="setupTitle">학습 설정</div>
    <button class="btn ghost" id="setupBackBtn">← 취소</button>
  </div>
  <div class="setup-card">

    <div class="option-group">
      <label class="option-label">학습 종류</label>
      <div class="option-row" id="modeChips">
        <button class="option-chip active" data-mode="word">단어 제시 <small>앞면: 단어</small></button>
        <button class="option-chip" data-mode="meaning">뜻 제시 <small>앞면: 뜻</small></button>
      </div>
    </div>

    <div class="option-group">
      <label class="option-label">카드 순서</label>
      <div class="option-row" id="orderChips">
        <button class="option-chip active" data-order="sequential">순서대로</button>
        <button class="option-chip" data-order="random">랜덤</button>
      </div>
    </div>

    <div class="option-group">
      <label class="option-label">별점 필터</label>
      <div class="option-row" id="filterChips">
        <button class="option-chip active" data-filter="0">전체</button>
        <button class="option-chip" data-filter="1">★ 이상</button>
        <button class="option-chip" data-filter="2">★★ 이상</button>
        <button class="option-chip" data-filter="3">★★★</button>
      </div>
    </div>

    <div class="option-group">
      <label class="option-label">끊어서 학습</label>
      <div class="toggle-row">
        <div class="toggle" id="chunkToggle" role="switch" tabindex="0"></div>
        <span class="toggle-label" id="chunkLabel">한 번에 모든 카드 학습</span>
        <input type="number" class="num-input" id="chunkSize" min="1" max="999" value="10" hidden />
        <span class="hint" id="chunkUnit" hidden>개씩</span>
      </div>
    </div>

    <div class="match-info" id="matchInfo">조건에 맞는 카드: 0개</div>

    <button class="btn primary lg" id="startSessionBtn">학습 시작</button>
  </div>
</section>

<!-- STUDY VIEW -->
<section class="view full-bleed" id="studyView">
  <!-- 상단 헤더 -->
  <div class="sv-header">
    <button class="sv-exit" id="exitStudyBtn">✕</button>
    <div class="sv-progress-counter">
      <span class="sv-known-count"><span id="knownCount">0</span></span>
      <span class="sv-divider">|</span>
      <span id="totalCount">0</span>
    </div>
    <div style="width:36px;"></div>
  </div>

  <!-- 카드 영역 -->
  <div class="sv-card-wrap">
    <div class="sv-card" id="svCard">
      <!-- 카드 진행 바 -->
      <div class="sv-card-progress">
        <div class="sv-card-progress-fill" id="svCardProgressFill"></div>
      </div>
      <div class="sv-card-progress-label" id="svCardProgressLabel">0 / 0 학습 완료</div>

      <!-- 카드 내부 상단 아이콘 바 (좌: 모드 | 중앙: 스피커 | 우: 별) -->
      <div class="sv-card-topbar">
        <span class="sv-mode-label" id="modeBadge">단어 제시</span>
        <button id="speakBtn" class="sv-topbar-speak" title="발음 듣기">🔊</button>
        <div class="sv-inline-stars" id="starRow">
          <button class="star-btn" data-star="1">★</button>
          <button class="star-btn" data-star="2">★</button>
          <button class="star-btn" data-star="3">★</button>
        </div>
      </div>

      <!-- 알겠음 플래시 오버레이 -->
      <div class="sv-known-flash" id="svKnownFlash">✓</div>

      <!-- 앞면: 단어 / 뜻 -->
      <div class="sv-front" id="svFront"></div>

      <!-- 커버 + 뒷면 래퍼 -->
      <div class="sv-reveal-area">
        <!-- 뒷면: 항상 렌더링, 커버 아래 -->
        <div class="sv-back" id="svBack"></div>
        <!-- 커버: 아래로 당겨서 걷기 / 위로 당겨서 다시 덮기 -->
        <div class="sv-cover" id="svCover">
          <!-- 핸들: revealed 상태에서 바닥에 노출되는 40px 띠 -->
          <div class="sv-cover-handle">
            <span class="sv-cover-pill"></span>
            <span class="sv-cover-up-hint">↑ 위로 당겨 다시 덮기</span>
          </div>
          <!-- 메인 힌트: 커버가 닫혀 있을 때 중앙 -->
          <div class="sv-cover-inner">
            <p class="sv-cover-hint">아래로 당기거나 클릭하세요</p>
            <p class="sv-cover-drag-hint">↓</p>
            <p class="sv-cover-key">SPACE</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 답 확인 후 버튼 -->
  <div class="sv-answer-btns" id="answerBtns">
    <button class="sv-btn-known" id="knownBtn">✓ 이제 알아요</button>
    <button class="sv-btn-unknown" id="unknownBtn">나중에 한번 더</button>
  </div>

  <!-- 키보드 힌트 -->
  <div class="sv-kbd-row" id="kbdRow">
    <span>SHIFT+SPACE</span>
    <span>SPACE</span>
  </div>
</section>

<!-- SESSION COMPLETE VIEW -->
<section class="view" id="completeView">
  <div class="complete-card">
    <div class="complete-icon">🎉</div>
    <h2>세션 완료!</h2>
    <div class="sub" id="completeSub">수고하셨습니다</div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="complete-actions" id="completeActions"></div>
  </div>
  <canvas id="confettiCanvas"></canvas>
</section>

</main>

<!-- CONFIRM MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modalTitle">확인</h3>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">취소</button>
      <button class="btn danger" id="modalConfirm">확인</button>
    </div>
  </div>
</div>

<!-- CARD PICKER OVERLAY (카드 선택해 새 단어장 / 여러 세트 합치기) -->
<div class="cpicker-backdrop" id="cardPicker">
  <div class="cpicker">
    <div class="cpicker-header">
      <h3 id="cpickerTitle">카드 선택</h3>
      <button class="cpicker-close" id="cpickerClose">✕</button>
    </div>
    <div id="cpickerSetTabs" class="cpicker-set-tabs"></div>
    <div id="cpickerCards" class="cpicker-cards"></div>
    <div class="cpicker-footer">
      <input type="text" class="text-input" id="cpickerName" placeholder="새 단어장 이름" />
      <div class="cpicker-foot-row">
        <span id="cpickerCount" class="cpicker-sel-count">0개 선택됨</span>
        <button class="btn primary" id="cpickerConfirm">새 단어장 만들기</button>
      </div>
    </div>
  </div>
</div>

<!-- STAR PICKER MODAL (별점 필터 추출) -->
<div class="modal-backdrop" id="starPickerModal">
  <div class="modal">
    <h3>별점 필터로 새 단어장 만들기</h3>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">선택한 별점 이상의 카드만 새 단어장으로 저장합니다.</p>
    <div class="star-picker-row" id="starPickerRow">
      <button class="sp-chip active" data-min="1">★ 이상</button>
      <button class="sp-chip" data-min="2">★★ 이상</button>
      <button class="sp-chip" data-min="3">★★★ 만</button>
    </div>
    <div class="sp-preview" id="spPreview"></div>
    <input type="text" class="text-input" id="spName" placeholder="새 단어장 이름" style="margin-bottom:16px;" />
    <div class="modal-actions">
      <button class="btn ghost" id="spCancel">취소</button>
      <button class="btn primary" id="spConfirm">만들기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
